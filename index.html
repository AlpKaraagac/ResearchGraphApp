<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f6">
<title>Research graph</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="toolbar">
  <div class="bar">
    <h1 id="graph-title">Research graph</h1>
    <span id="save-indicator" aria-live="polite"></span>
    <span class="spacer"></span>
    <button id="lint-btn" type="button" class="bar-btn">Lint <span id="lint-badge" class="badge">0</span></button>
    <button id="share-btn" type="button" class="bar-btn">Share</button>
    <div class="view-controls" role="group" aria-label="View controls">
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="fit" type="button">Fit</button>
    </div>
  </div>
  <div class="bar">
    <input id="search" type="search" placeholder="Search nodes…" aria-label="Search nodes" autocomplete="off">
  </div>
  <div id="type-filters" role="group" aria-label="Filter by node type"></div>
</header>
<main id="canvas" aria-label="Graph canvas">
  <div id="viewport">
    <svg id="edge-layer" width="2" height="2" aria-hidden="true">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z"></path>
        </marker>
      </defs>
      <g id="edge-lines"></g>
      <g id="edge-labels"></g>
    </svg>
    <div id="node-layer"></div>
  </div>
  <div id="empty-state" hidden>
    <p id="empty-message"></p>
  </div>
  <button id="add-node-btn" type="button" aria-label="Add node">＋</button>
  <aside id="lint-panel" class="sheet" hidden aria-label="Lint findings">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="detail-head">
      <h2 class="lint-title">Lint</h2>
      <button id="lint-close" type="button" class="close-x" aria-label="Close lint">×</button>
    </header>
    <div id="lint-list"></div>
  </aside>
  <aside id="detail" class="sheet" hidden aria-label="Node details">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="detail-head">
      <span id="detail-type" class="type-tag"></span>
      <span id="detail-status" class="status" hidden></span>
      <button id="detail-close" type="button" class="close-x" aria-label="Close details">×</button>
    </header>
    <h2 id="detail-label"></h2>
    <div class="panel-actions">
      <button id="detail-add-edge" type="button">＋ Relation</button>
      <button id="detail-edit" type="button">Edit</button>
      <button id="detail-delete" type="button" class="danger">Delete</button>
    </div>
    <dl id="detail-fields"></dl>
    <section id="detail-outgoing" hidden>
      <h3>Outgoing</h3>
      <div class="rel-list"></div>
    </section>
    <section id="detail-incoming" hidden>
      <h3>Incoming</h3>
      <div class="rel-list"></div>
    </section>
    <p id="detail-id" class="detail-id"></p>
  </aside>
</main>

<dialog id="node-dialog" class="dialog-full">
  <form id="node-form">
    <h2 id="node-dialog-title">Add node</h2>
    <label class="field">Type
      <select id="node-type"></select>
    </label>
    <label class="field">Label
      <textarea id="node-label" rows="3" required></textarea>
    </label>
    <label class="field" id="node-status-wrap">Status
      <select id="node-status"></select>
    </label>
    <fieldset class="fields-editor">
      <legend>Fields</legend>
      <div id="field-rows"></div>
      <button type="button" id="add-field-row">＋ Add field</button>
    </fieldset>
    <p id="node-id-preview" class="hint"></p>
    <p id="node-error" class="form-error" hidden></p>
    <div class="dialog-actions">
      <button type="button" data-close>Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="edge-dialog">
  <form id="edge-form">
    <h2>Add relation</h2>
    <p id="edge-source" class="hint"></p>
    <label class="field">With node
      <select id="edge-other"></select>
    </label>
    <label class="field">Relation
      <select id="edge-relation"></select>
    </label>
    <p id="edge-error" class="form-error" hidden></p>
    <div class="dialog-actions">
      <button type="button" data-close>Cancel</button>
      <button type="submit" class="primary">Add</button>
    </div>
  </form>
</dialog>

<dialog id="confirm-dialog">
  <h2 id="confirm-title"></h2>
  <div id="confirm-body"></div>
  <div class="dialog-actions">
    <button type="button" data-close>Cancel</button>
    <button type="button" id="confirm-ok" class="primary danger">Delete</button>
  </div>
</dialog>

<dialog id="share-dialog">
  <h2>Share &amp; data</h2>
  <div class="share-actions">
    <button type="button" id="export-json">Download graph JSON</button>
    <button type="button" id="export-canvas">Download JSON Canvas (.canvas)</button>
    <button type="button" id="export-html">Download self-contained HTML</button>
    <button type="button" id="import-btn">Import JSON or .canvas…</button>
    <button type="button" id="json-btn">Edit raw JSON</button>
  </div>
  <p id="share-info" class="hint" hidden></p>
  <p id="share-error" class="form-error" hidden></p>
  <div class="dialog-actions">
    <button type="button" data-close>Close</button>
  </div>
</dialog>
<input type="file" id="import-input" accept=".json,.canvas,application/json" hidden>

<dialog id="json-dialog" class="dialog-full">
  <form id="json-form">
    <h2>Graph JSON</h2>
    <textarea id="json-text" spellcheck="false" autocapitalize="off" autocomplete="off"
              aria-label="Graph JSON"></textarea>
    <p id="json-error" class="form-error" hidden></p>
    <div class="dialog-actions">
      <button type="button" data-close>Cancel</button>
      <button type="submit" class="primary">Apply</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
