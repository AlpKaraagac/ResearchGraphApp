<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research graph — tests</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 46rem; margin: 0 auto; padding: 1rem;
  }
  h1 { font-size: 1.2rem; }
  #summary { font-weight: 600; padding: .5rem .75rem; border-radius: .5rem; }
  #summary.pass { background: #1a7f3722; }
  #summary.fail { background: #cf222e22; }
  ul { list-style: none; padding: 0; }
  li { padding: .15rem .25rem; border-radius: .25rem; }
  li.pass::before { content: "✓ "; color: #1a7f37; }
  li.fail::before { content: "✗ "; color: #cf222e; }
  li.fail { background: #cf222e18; }
  li.fail pre { margin: .25rem 0 .25rem 1.2rem; white-space: pre-wrap; font-size: .85em; }
  h2 { font-size: 1rem; margin: 1.25rem 0 .25rem; }
</style>
</head>
<body>
<h1>Research graph — tests</h1>
<p id="summary">Running…</p>
<div id="results"></div>
<script type="module">
import {
  SCHEMA_VERSION, NODE_TYPES, STATUSES, statusesFor, isNodeType, emptyGraph, edgeKey,
  parentEdges, allEdges, childrenOf, validateNode, validateEdge, validateGraph,
} from './js/schema.js';
import { ID_PREFIXES, slugify, uniqueNodeId, eligibleParents } from './js/forms.js';
import { looksLikeOldMap, migrateOldMap } from './js/migrate.js';
import {
  toCanvas, fromCanvas, looksLikeCanvas, extractGraphFromHtml, importText,
} from './js/exporter.js';
import {
  extractZoteroKey, cslToSource, parseBibtex, parseSourcesText, planSourceImport, applySourcePatch,
} from './js/sources.js';
import { separateRects } from './js/layout.js';
import { saveBackup, loadBackup, clearBackup } from './js/store.js';

// ---- harness -------------------------------------------------------------

const results = [];
let section = '';
const describe = (name) => { section = name; };
function test(name, fn) {
  try {
    fn();
    results.push({ section, name, ok: true });
  } catch (error) {
    results.push({ section, name, ok: false, error });
  }
}
function assert(cond, message) {
  if (!cond) throw new Error(message ?? 'assertion failed');
}
function assertEqual(actual, expected, message) {
  if (actual !== expected) {
    throw new Error(`${message ?? 'not equal'}\n  expected: ${JSON.stringify(expected)}\n  actual:   ${JSON.stringify(actual)}`);
  }
}
function assertDeepEqual(actual, expected, message) {
  const a = JSON.stringify(actual);
  const b = JSON.stringify(expected);
  if (a !== b) {
    throw new Error(`${message ?? 'not deep-equal'}\n  expected: ${b}\n  actual:   ${a}`);
  }
}

const n = (id, type, extra) => ({ id, type, label: `label of ${id}`, ...extra });
const e = (from, relation, to) => ({ from, relation, to });
const g = (nodes, edges = []) => ({ version: 2, nodes, edges });

// ---- schema --------------------------------------------------------------

describe('Schema — the simplified type set');

test('four types are offered, with status suggestions per type', () => {
  assertDeepEqual(NODE_TYPES, ['question', 'experiment', 'source', 'note']);
  assert(isNodeType('experiment'));
  assert(!isNodeType('finding'), 'findings are folded into experiments now');
  assertDeepEqual(statusesFor('experiment'), ['planned', 'running', 'complete', 'abandoned']);
  assertDeepEqual(statusesFor('note'), []);
  assertDeepEqual(statusesFor('anything-else'), [], 'unknown types simply have no suggestions');
  assertEqual(SCHEMA_VERSION, 2);
});

test('emptyGraph is valid and edgeKey identifies a triple', () => {
  assertDeepEqual(validateGraph(emptyGraph()), []);
  assertEqual(edgeKey(e('a', 'uses', 'b')), edgeKey({ from: 'a', relation: 'uses', to: 'b' }));
  assert(edgeKey(e('a', 'uses', 'b')) !== edgeKey(e('a', 'needs', 'b')));
});

describe('Schema — validation is structural only');

test('a node needs an id, a type and a label, and nothing else', () => {
  assertDeepEqual(validateNode(n('q1', 'question')), []);
  assertDeepEqual(validateNode({
    id: 'ex1', type: 'experiment', label: 'A study', nature: 'statistical',
    description: 'what was done', result: 'what came out', status: 'anything at all',
  }), []);
  assert(validateNode({ type: 'question', label: 'x' }).some((m) => m.includes('"id"')));
  assert(validateNode({ id: 'a', label: 'x' }).some((m) => m.includes('"type"')));
  assert(validateNode({ id: 'a', type: 'question' }).some((m) => m.includes('"label"')));
});

test('no rules: any type name, any status, any relation between any two nodes', () => {
  const graph = g(
    [n('a', 'wildcard-type'), n('b', 'question', { status: 'marinating' })],
    [e('a', 'has a completely made up relation with', 'b')],
  );
  assertDeepEqual(validateGraph(graph), []);
});

test('graph-level problems are only shape, duplicates and dangling ends', () => {
  assert(validateGraph(null).length === 1);
  assert(validateGraph({ nodes: {}, edges: [] }).some((m) => m.includes('"nodes"')));
  assert(validateGraph(g([n('a', 'note'), n('a', 'note')])).some((m) => m.includes('duplicate')));
  assert(validateGraph(g([n('a', 'note')], [e('a', 'x', 'ghost')]))
    .some((m) => m.includes('missing node "ghost"')));
});

describe('Schema — sub-questions are a parent field');

const tree = g([
  n('root', 'question'),
  n('kid', 'question', { parent: 'root' }),
  n('grandkid', 'question', { parent: 'kid' }),
  n('ex1', 'experiment'),
], [e('ex1', 'addresses', 'kid')]);

test('parentEdges renders the tree; allEdges merges them with real edges', () => {
  assertDeepEqual(parentEdges(tree).map((x) => [x.from, x.to]), [['kid', 'root'], ['grandkid', 'kid']]);
  assert(parentEdges(tree).every((x) => x.derived === true), 'derived edges are marked');
  assertEqual(allEdges(tree).length, 3, 'one real edge plus two parent links');
});

test('a dangling or self parent is ignored rather than drawn', () => {
  const odd = g([n('a', 'question', { parent: 'nobody' }), n('b', 'question', { parent: 'b' })]);
  assertDeepEqual(parentEdges(odd), []);
});

test('childrenOf finds the direct sub-questions', () => {
  assertDeepEqual(childrenOf(tree, 'root').map((x) => x.id), ['kid']);
  assertDeepEqual(childrenOf(tree, 'grandkid'), []);
});

test('eligibleParents offers questions only, and never creates a cycle', () => {
  assertDeepEqual(eligibleParents(tree, 'kid').map((x) => x.id), ['root'],
    'grandkid is a descendant, so it cannot become the parent of kid');
  assertDeepEqual(eligibleParents(tree, 'root').map((x) => x.id), [],
    'everything else descends from root');
  assertDeepEqual(eligibleParents(tree, null).map((x) => x.id), ['root', 'kid', 'grandkid']);
});

// ---- edit helpers --------------------------------------------------------

describe('Edit helpers');

test('slugify and uniqueNodeId', () => {
  assertEqual(slugify('How much of the reaction is the perceiver?'), 'how-much-of-the');
  assertEqual(slugify('???'), 'node');
  assertEqual(uniqueNodeId('question', 'Open question', new Set()), 'q-open-question');
  assertEqual(uniqueNodeId('experiment', 'Study one', new Set(['ex-study-one'])), 'ex-study-one-2');
  assertDeepEqual(Object.keys(ID_PREFIXES).sort(), [...NODE_TYPES].sort());
});

// ---- migration: the merge --------------------------------------------------

describe('Migration — results fold into their experiments');

const oldMap = {
  meta: { title: 'Old map' },
  nodes: [
    { id: 'rq0', type: 'rq', label: 'Root question', detail: 'The big one.' },
    { id: 'rq1', type: 'rq', label: 'Sub question', status: 'answered' },
    { id: 'ex1', type: 'experiment', label: 'The study', status: 'complete',
      detail: 'Design and procedure.' },
    { id: 'r1', type: 'result', label: 'The headline result', fields: { p: '.01' } },
    { id: 'r2', type: 'result', label: 'The second result' },
    { id: 'r_loose', type: 'finding', label: 'A result with no study' },
    { id: 'p1', type: 'paper', label: 'A paper', status: 'to-read' },
    { id: 'cl1', type: 'claim', label: 'A claim', detail: 'What it means.' },
    { id: 'g1', type: 'gap', label: 'The gap' },
  ],
  edges: [
    { from: 'rq1', to: 'rq0', rel: 'sub-question' },
    { from: 'ex1', to: 'rq1', rel: 'tests' },
    { from: 'r1', to: 'ex1', rel: 'yields' },
    { from: 'r2', to: 'ex1', rel: 'yields' },
    { from: 'r1', to: 'cl1', rel: 'evidence' },
    { from: 'p1', to: 'g1', rel: 'names gap' },
  ],
};

test('looksLikeOldMap spots legacy types and rel-keyed edges', () => {
  assert(looksLikeOldMap(oldMap));
  assert(!looksLikeOldMap(g([n('q1', 'question')], [e('q1', 'x', 'q1')])));
});

test('a current-format graph is never mistaken for an old map', () => {
  // `experiment` is a current type; a graph full of them must not be migrated,
  // because the migration would strip nature / description / result.
  const current = g([
    n('ex1', 'experiment', { nature: 'statistical', description: 'what was done', result: 'what came out' }),
    n('q1', 'question'),
  ], [e('ex1', 'addresses', 'q1')]);
  assert(!looksLikeOldMap(current), 'version 2 alone settles it');
  const noVersion = { nodes: current.nodes, edges: current.edges };
  assert(!looksLikeOldMap(noVersion), 'and so do the fields the current schema introduced');
  const result = importText(JSON.stringify(current));
  assert(result.ok, result.message);
  const ex1 = result.graph.nodes.find((x) => x.id === 'ex1');
  assertEqual(ex1.nature, 'statistical', 'nature survives the import');
  assertEqual(ex1.result, 'what came out', 'the result survives the import');
  assert(!result.message.includes('Simplified'), 'and it is not reported as a migration');
});

test('a parent field alone marks a graph as current', () => {
  const current = { nodes: [n('q1', 'question'), n('q2', 'question', { parent: 'q1' })], edges: [] };
  assert(!looksLikeOldMap(current));
});

test('results merge into the experiment that yielded them', () => {
  const { graph, report } = migrateOldMap(oldMap);
  const byId = new Map(graph.nodes.map((x) => [x.id, x]));
  assert(!byId.has('r1') && !byId.has('r2'), 'merged results are no longer nodes');
  assertEqual(report.merged, 2);
  const ex = byId.get('ex1');
  assertEqual(ex.type, 'experiment');
  assertEqual(ex.description, 'Design and procedure.');
  assert(ex.result.includes('The headline result'), 'first result folded in');
  assert(ex.result.includes('The second result'), 'second result folded in');
  assert(ex.result.includes('p: .01'), 'the result carries its numbers');
  assertDeepEqual(validateGraph(graph), []);
});

test('an unattached result becomes an experiment that is all result', () => {
  const { graph } = migrateOldMap(oldMap);
  const loose = graph.nodes.find((x) => x.id === 'r_loose');
  assertEqual(loose.type, 'experiment');
  assert(loose.result.includes('A result with no study'));
});

test('sub-question edges become a parent field', () => {
  const { graph } = migrateOldMap(oldMap);
  const kid = graph.nodes.find((x) => x.id === 'rq1');
  assertEqual(kid.type, 'question');
  assertEqual(kid.parent, 'rq0');
  assert(!graph.edges.some((x) => x.from === 'rq1' && x.to === 'rq0'),
    'the edge is gone — the field replaces it');
});

test('types outside the core four survive as notes, labelled with what they were', () => {
  const { graph, report } = migrateOldMap(oldMap);
  const claim = graph.nodes.find((x) => x.id === 'cl1');
  assertEqual(claim.type, 'note');
  assertEqual(claim.fields.Kind, 'claim');
  assert(claim.fields.Detail.includes('What it means.'), 'nothing is lost, only re-typed');
  assertEqual(report.becameNotes, 2, 'the claim and the gap');
  assertEqual(graph.nodes.find((x) => x.id === 'p1').type, 'source');
});

test('edges to a merged result re-point at its experiment, and labels are free text', () => {
  const { graph } = migrateOldMap(oldMap);
  assert(graph.edges.some((x) => x.from === 'ex1' && x.relation === 'evidence' && x.to === 'cl1'),
    'r1 —evidence→ cl1 became ex1 —evidence→ cl1');
  assert(graph.edges.some((x) => x.relation === 'names gap'), 'free-text labels survive');
  assert(!graph.edges.some((x) => x.from === x.to), 'edges internal to a merge are dropped');
});

test('importText routes an old map through the migration', () => {
  const result = importText(JSON.stringify(oldMap));
  assert(result.ok, result.message);
  assert(result.message.includes('Simplified an older map'));
  assertDeepEqual(validateGraph(result.graph), []);
});

// ---- export / import -------------------------------------------------------

describe('Export and import');

const canvasGraph = {
  version: 2,
  meta: { id: 'demo', title: 'Demo' },
  nodes: [
    { id: 'ex1', type: 'experiment', label: 'A study', nature: 'statistical',
      result: 'p < .01', x: 100, y: 50 },
    { id: 'q1', type: 'question', label: 'A question', x: 300, y: 50 },
  ],
  edges: [{ from: 'ex1', relation: 'addresses', to: 'q1' }],
};

test('our own .canvas round-trips losslessly', () => {
  const { graph } = fromCanvas(toCanvas(canvasGraph));
  assertDeepEqual(graph.nodes, canvasGraph.nodes);
  assertDeepEqual(graph.edges, canvasGraph.edges);
  assert(looksLikeCanvas(toCanvas(canvasGraph)));
  assert(!looksLikeCanvas(canvasGraph));
});

test('a foreign canvas keeps whatever labels its edges carry', () => {
  const foreign = {
    nodes: [
      { id: 'a', type: 'text', text: 'An idea\nwith detail', x: 0, y: 0, width: 200, height: 60 },
      { id: 'b', type: 'text', text: 'Another', x: 300, y: 0, width: 200, height: 60 },
    ],
    edges: [{ id: 'e1', fromNode: 'a', toNode: 'b', label: 'whatever I like' }],
  };
  const { graph } = fromCanvas(foreign);
  assertDeepEqual(graph.nodes.map((x) => x.type), ['note', 'note']);
  assertDeepEqual(graph.edges, [{ from: 'a', relation: 'whatever I like', to: 'b' }]);
});

test('a self-contained HTML export can be imported straight back', () => {
  const html = [
    '<!DOCTYPE html><html><body>',
    `<script type="application/json" id="embedded-graph">${JSON.stringify(canvasGraph).replace(/</g, '\\u003c')}\u003c/script>`,
    '</body></html>',
  ].join('\n');
  assertDeepEqual(JSON.parse(extractGraphFromHtml(html)), canvasGraph);
  const result = importText(html);
  assert(result.ok, result.message);
  assert(result.message.includes('extracted from the HTML file'));
});

// ---- sources ---------------------------------------------------------------

describe('Sources — CSL and BibTeX');

test('cslToSource builds a source node', () => {
  const node = cslToSource({
    id: '392648/7VLLCTW7', 'citation-key': 'kenny1994', type: 'book',
    title: 'Interpersonal perception', author: [{ family: 'Kenny', given: 'David A.' }],
    issued: { 'date-parts': [[1994]] }, 'container-title': 'Guilford Press', DOI: '10.1000/x',
  });
  assertEqual(node.id, 'kenny1994');
  assertEqual(node.label, 'Kenny (1994) — Interpersonal perception');
  assertEqual(node.meta.zoteroKey, '7VLLCTW7');
  assertEqual(extractZoteroKey('kenny1994'), undefined);
  assertDeepEqual(validateNode(node), []);
});

test('parseBibtex reads braces, quotes and biblatex fields', () => {
  const items = parseBibtex(`
    @article{kenny1994,
      author = {Kenny, David A. and Cook, William},
      title = {Interpersonal {Perception}},
      journal = "Psychological Review", year = 1994, pages = {246--268}
    }`);
  assertEqual(items.length, 1);
  assertEqual(items[0].title, 'Interpersonal Perception');
  assertEqual(items[0].page, '246–268');
  assertDeepEqual(items[0].author, [
    { family: 'Kenny', given: 'David A.' }, { family: 'Cook', given: 'William' },
  ]);
});

test('parseSourcesText accepts CSL arrays, {items} objects and BibTeX', () => {
  assertEqual(parseSourcesText('[{"id":"a","title":"T"}]').items.length, 1);
  assertEqual(parseSourcesText('{"items":[{"id":"a","title":"T"}]}').items.length, 1);
  assertEqual(parseSourcesText('@misc{x, title={T}}').items.length, 1);
  let threw = false;
  try { parseSourcesText('hello'); } catch { threw = true; }
  assert(threw);
});

test('re-import updates rather than duplicating, and never touches status', () => {
  const graph = g([n('src-a', 'source', { status: 'verified', meta: { zoteroKey: 'AAAA1111' } })]);
  const plan = planSourceImport(graph, [
    { id: '99/AAAA1111', title: 'A new title', author: [{ family: 'A' }] },
    { id: 'brand-new', title: 'D', author: [{ family: 'D' }] },
  ]);
  assertDeepEqual(plan.updates.map((u) => u.id), ['src-a']);
  assertDeepEqual(plan.creates.map((c) => c.id), ['brand-new']);
  assertEqual(plan.creates[0].status, 'to read');
  const node = graph.nodes[0];
  applySourcePatch(node, plan.updates[0].patch);
  assertEqual(node.status, 'verified', 'status survives a re-import');
});

// ---- embedded vs stored precedence ----------------------------------------

describe('Embedded file versus a stored copy');

// The rule the loader applies when a self-contained file is opened and the
// browser already holds a graph with the same id.
function storedWins(embedded, stored) {
  return Boolean(stored)
    && validateGraph(stored).length === 0
    && Boolean(embedded.meta?.modified)
    && (stored.meta?.modified ?? '') > embedded.meta.modified;
}

test('a file with no timestamp wins over any stored copy', () => {
  // Otherwise a stale copy of an earlier version of the same file hides the
  // file's own contents — which is exactly how a gutted graph kept showing.
  const embedded = { meta: { id: 'g' }, nodes: [n('ex1', 'experiment', { result: 'the numbers' })], edges: [] };
  const stored = { meta: { id: 'g', modified: '2026-08-22T09:15:38.775Z' },
                   nodes: [n('ex1', 'experiment')], edges: [] };
  assert(!storedWins(embedded, stored), 'the opened file wins');
});

test('a genuinely newer local edit still wins over a timestamped file', () => {
  const embedded = { meta: { id: 'g', modified: '2026-08-01T00:00:00.000Z' }, nodes: [], edges: [] };
  const newer = { meta: { id: 'g', modified: '2026-08-02T00:00:00.000Z' }, nodes: [], edges: [] };
  const older = { meta: { id: 'g', modified: '2026-07-01T00:00:00.000Z' }, nodes: [], edges: [] };
  assert(storedWins(embedded, newer), 'later edits are not discarded');
  assert(!storedWins(embedded, older), 'an older copy never wins');
  assert(!storedWins(embedded, null), 'nothing stored, nothing to prefer');
});

// ---- the clear safety net --------------------------------------------------

describe('Store — the backup behind Clear');

test('a cleared map round-trips through the backup and is consumed by undo', () => {
  const graph = {
    version: 2,
    meta: { id: 'test-backup-graph', title: 'Doomed' },
    nodes: [n('q1', 'question'), n('ex1', 'experiment', { result: 'it worked' })],
    edges: [e('ex1', 'addresses', 'q1')],
  };
  try {
    assertEqual(loadBackup('test-backup-graph'), null, 'nothing there to begin with');
    assert(saveBackup(graph).ok);
    const restored = loadBackup('test-backup-graph');
    assertDeepEqual(restored, graph, 'the whole graph comes back, results and all');
    clearBackup('test-backup-graph');
    assertEqual(loadBackup('test-backup-graph'), null, 'undo consumes the backup');
  } finally {
    clearBackup('test-backup-graph');
  }
});

test('a graph with no id cannot be backed up, and missing ids read as null', () => {
  assertEqual(saveBackup({ meta: {}, nodes: [], edges: [] }).ok, false);
  assertEqual(loadBackup(undefined), null);
});

// ---- layout ----------------------------------------------------------------

describe('Layout — separateRects');

test('overlapping cards are pushed apart; clear ones are left alone', () => {
  const sizes = new Map([['a', { w: 100, h: 40 }], ['b', { w: 100, h: 40 }]]);
  const crowded = new Map([['a', { x: 0, y: 0 }], ['b', { x: 30, y: 5 }]]);
  assert(separateRects(crowded, sizes) === true);
  const a = crowded.get('a'); const b = crowded.get('b');
  assert(Math.abs(a.x - b.x) >= 100 || Math.abs(a.y - b.y) >= 40, 'no longer overlapping');

  const clear = new Map([['a', { x: 0, y: 0 }], ['b', { x: 500, y: 0 }]]);
  assert(separateRects(clear, sizes) === false);
});

test('a pile of coincident cards fully separates', () => {
  const sizes = new Map();
  const positions = new Map();
  for (let i = 0; i < 12; i++) {
    sizes.set(`n${i}`, { w: 180, h: 60 });
    positions.set(`n${i}`, { x: 0, y: 0 });
  }
  separateRects(positions, sizes);
  const ids = [...positions.keys()];
  let overlaps = 0;
  for (let i = 0; i < ids.length; i++) {
    for (let j = i + 1; j < ids.length; j++) {
      const p = positions.get(ids[i]); const q = positions.get(ids[j]);
      if (Math.abs(p.x - q.x) < 180 && Math.abs(p.y - q.y) < 60) overlaps += 1;
    }
  }
  assertEqual(overlaps, 0);
});

// ---- render --------------------------------------------------------------

const container = document.getElementById('results');
let currentSection = null;
let list = null;
for (const r of results) {
  if (r.section !== currentSection) {
    currentSection = r.section;
    const h = document.createElement('h2');
    h.textContent = r.section;
    container.append(h);
    list = document.createElement('ul');
    container.append(list);
  }
  const li = document.createElement('li');
  li.className = r.ok ? 'pass' : 'fail';
  li.textContent = r.name;
  if (!r.ok) {
    const pre = document.createElement('pre');
    pre.textContent = String(r.error?.stack ?? r.error);
    li.append(pre);
  }
  list.append(li);
}
const failed = results.filter((r) => !r.ok).length;
const summary = document.getElementById('summary');
summary.textContent = failed === 0
  ? `All ${results.length} tests pass`
  : `${failed} of ${results.length} tests FAILED`;
summary.className = failed === 0 ? 'pass' : 'fail';
document.title = `${failed === 0 ? '✓' : '✗'} Research graph — tests`;
</script>
</body>
</html>
