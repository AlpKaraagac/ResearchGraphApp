<body>
<h1>Research graph — schema and lint tests</h1>
<p id="summary">Running…</p>
<div id="results"></div>
<script type="module">
import {
  SCHEMA_VERSION, FAMILIES, NODE_TYPES, STATUSES, RELATIONS, RELATION_NAMES,
  isNodeType, statusesFor, isValidStatus, relationAllows, validRelations,
  emptyGraph, edgeKey, validateNode, validateEdge, validateGraph, upgradeGraph,
} from './js/schema.js';
import { LINT_RULES, lint } from './js/lint.js';
import { ID_PREFIXES, slugify, uniqueNodeId, directedRelationOptions } from './js/forms.js';
import { toCanvas, fromCanvas, looksLikeCanvas, extractGraphFromHtml, importText } from './js/exporter.js';
import {
  extractZoteroKey, cslToSource, parseBibtex, parseSourcesText, planSourceImport, applySourcePatch,
} from './js/sources.js';
import { looksLikeOldMap, migrateOldMap } from './js/migrate.js';

// ---- harness -------------------------------------------------------------

const results = [];
let section = '';
const describe = (name) => { section = name; };
function test(name, fn) {
  try {
    fn();
    results.push({ section, name, ok: true });
  } catch (error) {
    results.push({ section, name, ok: false, error });
  }
}
function assert(cond, message) {
  if (!cond) throw new Error(message ?? 'assertion failed');
}
function assertEqual(actual, expected, message) {
  if (actual !== expected) {
    throw new Error(`${message ?? 'not equal'}\n  expected: ${JSON.stringify(expected)}\n  actual:   ${JSON.stringify(actual)}`);
  }
}
function assertDeepEqual(actual, expected, message) {
  const a = JSON.stringify(actual);
  const b = JSON.stringify(expected);
  if (a !== b) {
    throw new Error(`${message ?? 'not deep-equal'}\n  expected: ${b}\n  actual:   ${a}`);
  }
}

// ---- graph-building helpers ----------------------------------------------

// claims default to kind: empirical (the v1.1 documented default); pass
// { kind: 'argued' } in extra to override
const n = (id, type, status, extra) => ({
  id, type, label: `label of ${id}`,
  ...(type === 'claim' ? { kind: 'empirical' } : {}),
  ...(status ? { status } : {}),
  ...extra,
});
const e = (from, relation, to) => ({ from, relation, to });
const g = (nodes, edges = []) => ({ version: 1, nodes, edges });

// lint findings for one rule id, reduced to the nodeIds it flagged
function flagged(graph, ruleId) {
  return lint(graph).filter((f) => f.id === ruleId).map((f) => f.nodeId);
}

// ---- schema: vocabularies ------------------------------------------------

describe('Schema — types and statuses');

test('exactly the eleven node types, in four families', () => {
  assertDeepEqual(NODE_TYPES, [
    'question', 'gap', 'construct', 'source', 'study', 'method', 'material',
    'finding', 'claim', 'note', 'task',
  ]);
  assertDeepEqual(Object.keys(FAMILIES), ['asking', 'grounding', 'doing', 'concluding']);
});

test('status vocabularies match SCHEMA.md section 2 exactly', () => {
  assertDeepEqual(Object.keys(STATUSES).sort(), [...NODE_TYPES].sort(), 'every type has a vocabulary');
  assertDeepEqual(STATUSES.question, ['open', 'answered', 'partly-answered', 'bounded', 'abandoned']);
  assertDeepEqual(STATUSES.gap, ['asserted', 'verified', 'contested', 'closed-by-others']);
  assertDeepEqual(STATUSES.study, ['planned', 'running', 'complete', 'abandoned']);
  assertDeepEqual(STATUSES.finding, ['supported', 'null-with-bound', 'untestable', 'sealed', 'withdrawn', 'invalid']);
  assertDeepEqual(STATUSES.claim, ['established', 'provisional', 'contested', 'abandoned']);
  assertDeepEqual(STATUSES.source, ['to-read', 'read', 'verified', 'unverified']);
  assertDeepEqual(STATUSES.method, ['draft', 'preregistered', 'run', 'superseded']);
  assertDeepEqual(STATUSES.material, ['planned', 'collected', 'frozen']);
  assertDeepEqual(STATUSES.note, []);
  assertDeepEqual(STATUSES.task, ['todo', 'doing', 'done']);
});

test('construct is statusless, like note (confirmed reading of the §2 omission)', () => {
  assertDeepEqual(STATUSES.construct, []);
});

test('isValidStatus accepts vocabulary words and rejects other types’ words', () => {
  assert(isValidStatus('finding', 'sealed'));
  assert(!isValidStatus('source', 'sealed'), 'sealed means nothing for a source');
  assert(!isValidStatus('finding', 'to-read'), 'to-read means nothing for a finding');
  assert(!isValidStatus('nonsense', 'open'), 'unknown type is invalid');
});

test('a missing status is valid for every type; a set status on note/construct is not', () => {
  assert(isValidStatus('question', undefined));
  assert(isValidStatus('note', ''));
  assert(isValidStatus('construct', null));
  assert(!isValidStatus('note', 'done'));
  assert(!isValidStatus('construct', 'draft'));
});

test('isNodeType / statusesFor', () => {
  assert(isNodeType('material'));
  assert(!isNodeType('experiment'), 'old-map names are not types');
  assertDeepEqual(statusesFor('task'), ['todo', 'doing', 'done']);
  assertEqual(statusesFor('experiment'), null);
});

// ---- schema: relations ---------------------------------------------------

describe('Schema — relations');

test('exactly the twenty-one relations of SCHEMA.md section 3 (v1.1)', () => {
  assertDeepEqual([...RELATION_NAMES].sort(), [
    'addresses', 'answers', 'asks', 'blocks', 'bounds', 'builds-on', 'composes',
    'contradicts', 'converges', 'documents', 'extends', 'grounds', 'inspires',
    'invalidates', 'motivates', 'qualifies', 'supports', 'threatens', 'uses',
    'validates', 'yields',
  ]);
});

test('from → to constraints hold for every listed pair', () => {
  assert(relationAllows('asks', 'question', 'question'));
  assert(relationAllows('motivates', 'gap', 'question'));
  assert(relationAllows('motivates', 'finding', 'study'));
  assert(relationAllows('motivates', 'claim', 'study'));
  assert(relationAllows('addresses', 'study', 'question'));
  assert(relationAllows('uses', 'method', 'study'));
  assert(relationAllows('uses', 'material', 'study'));
  assert(relationAllows('yields', 'finding', 'study'));
  assert(relationAllows('extends', 'study', 'study'));
  assert(relationAllows('validates', 'finding', 'method'));
  assert(relationAllows('validates', 'finding', 'study'));
  assert(relationAllows('invalidates', 'finding', 'finding'));
  assert(relationAllows('invalidates', 'study', 'finding'));
  assert(relationAllows('supports', 'finding', 'claim'));
  assert(relationAllows('supports', 'finding', 'finding'));
  assert(relationAllows('contradicts', 'finding', 'claim'));
  assert(relationAllows('contradicts', 'finding', 'finding'));
  assert(relationAllows('contradicts', 'source', 'claim'));
  assert(relationAllows('contradicts', 'source', 'finding'));
  assert(relationAllows('bounds', 'finding', 'finding'));
  assert(relationAllows('bounds', 'finding', 'question'));
  assert(relationAllows('converges', 'source', 'finding'));
  assert(relationAllows('converges', 'source', 'claim'));
  assert(relationAllows('answers', 'claim', 'question'));
  assert(relationAllows('composes', 'claim', 'claim'));
  assert(relationAllows('grounds', 'source', 'construct'));
  assert(relationAllows('grounds', 'source', 'gap'));
  assert(relationAllows('grounds', 'source', 'claim'));
  assert(relationAllows('grounds', 'source', 'question'));
  assert(relationAllows('documents', 'source', 'material'));
  assert(relationAllows('builds-on', 'source', 'source'));
  assert(relationAllows('threatens', 'source', 'claim'));
  assert(relationAllows('threatens', 'source', 'gap'));
  assert(relationAllows('inspires', 'source', 'method'));
  assert(relationAllows('inspires', 'source', 'study'));
});

test('qualifies and blocks go from note/task to anything', () => {
  for (const type of NODE_TYPES) {
    assert(relationAllows('qualifies', 'note', type), `note qualifies ${type}`);
    assert(relationAllows('blocks', 'task', type), `task blocks ${type}`);
  }
  assert(!relationAllows('qualifies', 'task', 'note'), 'only notes qualify');
  assert(!relationAllows('blocks', 'note', 'task'), 'only tasks block');
});

test('constraints reject direction flips and off-schema pairs', () => {
  assert(!relationAllows('supports', 'claim', 'finding'), 'supports does not run claim → finding');
  assert(!relationAllows('supports', 'source', 'claim'), 'sources converge or contradict, never support');
  assert(!relationAllows('yields', 'study', 'finding'), 'yields runs finding → study, not the reverse');
  assert(!relationAllows('uses', 'study', 'method'), 'uses runs method → study, not the reverse');
  assert(!relationAllows('addresses', 'question', 'study'));
  assert(!relationAllows('motivates', 'question', 'gap'));
  assert(!relationAllows('motivates', 'finding', 'claim'), 'motivates widened to studies only');
  assert(!relationAllows('bounds', 'finding', 'claim'), 'bounds never reaches a claim');
  assert(!relationAllows('converges', 'finding', 'claim'), 'converges is for sources');
  assert(!relationAllows('extends', 'finding', 'study'), 'extends is study → study');
  assert(!relationAllows('composes', 'claim', 'question'));
  assert(!relationAllows('documents', 'source', 'study'));
  assert(!relationAllows('threatens', 'source', 'question'), 'threatens still stops at claims and gaps');
  assert(!relationAllows('made-up', 'finding', 'claim'), 'unknown relation');
});

test('validRelations lists exactly the legal edges between two types', () => {
  assertDeepEqual(validRelations('finding', 'claim'), ['supports', 'contradicts']);
  assertDeepEqual(validRelations('source', 'gap'), ['grounds', 'threatens']);
  assertDeepEqual(validRelations('source', 'claim'), ['contradicts', 'converges', 'grounds', 'threatens']);
  assertDeepEqual(validRelations('source', 'finding'), ['contradicts', 'converges']);
  assertDeepEqual(validRelations('source', 'question'), ['grounds']);
  assertDeepEqual(validRelations('source', 'material'), ['documents']);
  assertDeepEqual(validRelations('source', 'source'), ['builds-on']);
  assertDeepEqual(validRelations('finding', 'question'), ['bounds']);
  assertDeepEqual(validRelations('finding', 'finding'), ['invalidates', 'supports', 'contradicts', 'bounds']);
  assertDeepEqual(validRelations('finding', 'study'), ['motivates', 'yields', 'validates']);
  assertDeepEqual(validRelations('study', 'study'), ['extends']);
  assertDeepEqual(validRelations('study', 'finding'), ['invalidates']);
  assertDeepEqual(validRelations('claim', 'claim'), ['composes']);
  assertDeepEqual(validRelations('claim', 'study'), ['motivates']);
  assertDeepEqual(validRelations('note', 'material'), ['qualifies']);
  assertDeepEqual(validRelations('claim', 'finding'), [], 'nothing runs claim → finding');
  assertDeepEqual(validRelations('material', 'question'), [], 'nothing runs material → question');
});

// ---- schema: validation --------------------------------------------------

describe('Schema — node validation');

test('a well-formed node has no errors', () => {
  assertDeepEqual(validateNode(n('q1', 'question', 'open')), []);
  assertDeepEqual(validateNode(n('c1', 'construct')), []);
  assertDeepEqual(validateNode({
    id: 'src1', type: 'source', label: 'Kenny 1994', status: 'read',
    fields: { Citation: 'Guilford Press', Type: 'book' },
    meta: { doi: '10.1000/x', zoteroKey: 'ABC123' },
  }), []);
});

test('unknown extra properties are allowed (layout data must survive)', () => {
  assertDeepEqual(validateNode(n('q1', 'question', 'open', { x: 10, y: 20, pinned: true })), []);
});

test('missing id, type or label are each caught', () => {
  assert(validateNode({ type: 'question', label: 'x' }).some((m) => m.includes('"id"')));
  assert(validateNode({ id: 'a', label: 'x' }).some((m) => m.includes('unknown type')));
  assert(validateNode({ id: 'a', type: 'rq', label: 'x' }).some((m) => m.includes('unknown type')));
  assert(validateNode({ id: 'a', type: 'question' }).some((m) => m.includes('"label"')));
  assert(validateNode('not a node').length === 1);
});

test('status must belong to the node type', () => {
  assert(validateNode(n('f1', 'finding', 'to-read')).some((m) => m.includes('not a finding status')));
  assert(validateNode(n('n1', 'note', 'done')).some((m) => m.includes('takes no status')));
  assert(validateNode(n('c1', 'construct', 'open')).some((m) => m.includes('takes no status')));
  assertDeepEqual(validateNode(n('t1', 'task', 'doing')), []);
});

test('claims require kind: empirical or argued; other types ignore it', () => {
  assertDeepEqual(validateNode(n('c1', 'claim', 'provisional')), [], 'helper supplies empirical');
  assertDeepEqual(validateNode(n('c1', 'claim', 'provisional', { kind: 'argued' })), []);
  const bare = { id: 'c1', type: 'claim', label: 'x', status: 'provisional' };
  assert(validateNode(bare).some((m) => m.includes('"kind"')), 'missing kind is an error');
  assert(validateNode({ ...bare, kind: 'vibes' }).some((m) => m.includes('"kind"')),
    'made-up kinds are rejected');
  assertDeepEqual(validateNode(n('q1', 'question', 'open', { kind: 'argued' })), [],
    'kind on a non-claim is a tolerated extra, like any unknown property');
});

test('fields values must be strings; fields and meta must be objects', () => {
  assert(validateNode(n('s1', 'source', 'read', { fields: 'DOI' })).length === 1);
  assert(validateNode(n('s1', 'source', 'read', { fields: { Citation: 42 } })).some((m) => m.includes('fields.Citation')));
  assert(validateNode(n('s1', 'source', 'read', { meta: [] })).some((m) => m.includes('"meta"')));
});

describe('Schema — edge and graph validation');

const twoNodes = new Map([
  ['f1', n('f1', 'finding', 'supported')],
  ['c1', n('c1', 'claim', 'provisional')],
  ['s1', n('s1', 'study', 'complete')],
]);

test('a well-formed edge has no errors', () => {
  assertDeepEqual(validateEdge(e('f1', 'supports', 'c1'), twoNodes), []);
  assertDeepEqual(validateEdge(e('f1', 'yields', 's1'), twoNodes), []);
});

test('unknown relations, missing endpoints and self-loops are caught', () => {
  assert(validateEdge(e('f1', 'proves', 'c1'), twoNodes).some((m) => m.includes('unknown relation')));
  assert(validateEdge(e('f1', 'supports', 'ghost'), twoNodes).some((m) => m.includes('missing node "ghost"')));
  assert(validateEdge(e('ghost', 'supports', 'c1'), twoNodes).some((m) => m.includes('missing node "ghost"')));
  assert(validateEdge(e('f1', 'supports', 'f1'), twoNodes).some((m) => m.includes('itself')));
});

test('type-pair violations name the allowed shapes', () => {
  const errors = validateEdge(e('c1', 'supports', 'f1'), twoNodes);
  assertEqual(errors.length, 1);
  assert(errors[0].includes('does not go claim → finding'));
  assert(errors[0].includes('finding → claim'), 'error teaches the allowed direction');
});

test('empty graph is valid; emptyGraph() produces one', () => {
  assertDeepEqual(validateGraph(emptyGraph()), []);
  assertEqual(emptyGraph().version, SCHEMA_VERSION);
});

test('a small coherent graph is valid', () => {
  assertDeepEqual(validateGraph(g(
    [n('g1', 'gap', 'asserted'), n('q1', 'question', 'open'), n('s1', 'study', 'running')],
    [e('g1', 'motivates', 'q1'), e('s1', 'addresses', 'q1')],
  )), []);
});

test('graph-level problems: shape, version, duplicate ids, duplicate edges', () => {
  assert(validateGraph(null).length === 1);
  assert(validateGraph({ version: 2, nodes: [], edges: [] }).some((m) => m.includes('version')));
  assert(validateGraph({ nodes: {}, edges: [] }).some((m) => m.includes('"nodes"')));
  assert(validateGraph({ nodes: [], edges: null }).some((m) => m.includes('"edges"')));
  assert(validateGraph(g([n('a', 'note'), n('a', 'note')])).some((m) => m.includes('duplicate node id "a"')));
  const dup = g(
    [n('f1', 'finding'), n('c1', 'claim')],
    [e('f1', 'supports', 'c1'), e('f1', 'supports', 'c1')],
  );
  assert(validateGraph(dup).some((m) => m.includes('duplicate edge')));
});

test('edgeKey identifies an edge by its (from, relation, to) triple', () => {
  assertEqual(edgeKey(e('a', 'supports', 'b')), edgeKey({ from: 'a', relation: 'supports', to: 'b' }));
  assert(edgeKey(e('a', 'supports', 'b')) !== edgeKey(e('a', 'bounds', 'b')));
});

// ---- lint ----------------------------------------------------------------

describe('Lint — rule metadata');

test('nine rules with the v1.1 severity split: errors 1/7/8/9, warnings 2/3/5/6', () => {
  assertDeepEqual([...new Set(LINT_RULES.map((r) => r.rule))], [1, 2, 3, 4, 5, 6, 7, 8, 9]);
  const severityOf = (id) => LINT_RULES.find((r) => r.id === id).severity;
  for (const id of ['unsupported-claim', 'unhandled-threat', 'status-mismatch', 'ungrounded-argument']) {
    assertEqual(severityOf(id), 'error', `${id} is an error`);
  }
  for (const id of ['orphan-finding', 'unaddressed-question', 'no-synthesis', 'bare-study', 'unverified-citation']) {
    assertEqual(severityOf(id), 'warning', `${id} is a warning`);
  }
});

test('an empty graph lints clean', () => {
  assertDeepEqual(lint(emptyGraph()), []);
});

describe('Lint rule 1 — unsupported claim');

test('an empirical claim with no incoming supports is flagged, as an error', () => {
  const findings = lint(g([n('c1', 'claim', 'provisional')]));
  assertDeepEqual(findings.map((f) => [f.id, f.severity, f.nodeId]),
    [['unsupported-claim', 'error', 'c1']]);
});

test('one supporting finding clears it', () => {
  const graph = g(
    [n('c1', 'claim', 'provisional'), n('f1', 'finding', 'supported'), n('q1', 'question', 'open')],
    [e('f1', 'supports', 'c1')],
  );
  assertDeepEqual(flagged(graph, 'unsupported-claim'), []);
});

test('a contradicting finding is not support', () => {
  const graph = g(
    [n('c1', 'claim', 'contested'), n('f1', 'finding', 'supported')],
    [e('f1', 'contradicts', 'c1')],
  );
  assertDeepEqual(flagged(graph, 'unsupported-claim'), ['c1']);
});

test('an argued claim is exempt from rule 1', () => {
  const graph = g(
    [n('c1', 'claim', 'provisional', { kind: 'argued' }), n('s1', 'source', 'verified')],
    [e('s1', 'grounds', 'c1')],
  );
  assertDeepEqual(flagged(graph, 'unsupported-claim'), []);
});

describe('Lint rule 9 — argued claim with no grounds');

test('an argued claim with no incoming grounds is an error; grounds clears it', () => {
  const bare = lint(g([n('c1', 'claim', 'provisional', { kind: 'argued' })]));
  assertDeepEqual(bare.map((f) => [f.id, f.severity]), [['ungrounded-argument', 'error']]);
  const grounded = g(
    [n('c1', 'claim', 'provisional', { kind: 'argued' }), n('s1', 'source', 'verified')],
    [e('s1', 'grounds', 'c1')],
  );
  assertDeepEqual(flagged(grounded, 'ungrounded-argument'), []);
});

test('converges is not grounds, and empirical claims never trigger rule 9', () => {
  const converged = g(
    [n('c1', 'claim', 'provisional', { kind: 'argued' }), n('s1', 'source', 'verified')],
    [e('s1', 'converges', 'c1')],
  );
  assertDeepEqual(flagged(converged, 'ungrounded-argument'), ['c1']);
  assertDeepEqual(flagged(g([n('c2', 'claim', 'provisional')]), 'ungrounded-argument'), []);
});

describe('Lint rule 2 — orphan finding');

test('a supported finding that carries nothing is flagged, as a warning', () => {
  const findings = lint(g([n('f1', 'finding', 'supported')]))
    .filter((f) => f.id === 'orphan-finding');
  assertDeepEqual(findings.map((f) => [f.severity, f.nodeId]), [['warning', 'f1']]);
  assertDeepEqual(flagged(g([n('f1', 'finding', 'null-with-bound')]), 'orphan-finding'), ['f1']);
});

test('a finding that only yields or motivates is still an orphan', () => {
  const graph = g(
    [n('f1', 'finding', 'supported'), n('s1', 'study', 'complete'), n('s2', 'study', 'planned')],
    [e('f1', 'yields', 's1'), e('f1', 'motivates', 's2')],
  );
  assertDeepEqual(flagged(graph, 'orphan-finding'), ['f1']);
});

test('any outgoing supports, bounds, contradicts or validates clears it', () => {
  const graph = g(
    [n('f1', 'finding', 'supported'), n('c1', 'claim', 'provisional'),
     n('f2', 'finding', 'null-with-bound'), n('q1', 'question', 'bounded'),
     n('f3', 'finding', 'supported'), n('m1', 'method', 'run'),
     n('f4', 'finding', 'supported')],
    [e('f1', 'supports', 'c1'), e('f2', 'bounds', 'q1'),
     e('f3', 'validates', 'm1'), e('f4', 'contradicts', 'c1')],
  );
  assertDeepEqual(flagged(graph, 'orphan-finding'), []);
});

test('exemption: a sealed finding with no outgoing edges must not flag', () => {
  assertDeepEqual(flagged(g([n('f1', 'finding', 'sealed')]), 'orphan-finding'), []);
});

test('untestable, withdrawn, invalid and status-less findings are exempt too', () => {
  const graph = g([
    n('f1', 'finding', 'untestable'), n('f2', 'finding', 'withdrawn'),
    n('f3', 'finding', 'invalid'), n('f4', 'finding'),
  ]);
  assertDeepEqual(flagged(graph, 'orphan-finding'), []);
});

describe('Lint rule 3 — unaddressed question and no synthesis');

test('a leaf question nothing touches is flagged, as a warning', () => {
  const findings = lint(g([n('q1', 'question', 'open')]))
    .filter((f) => f.id === 'unaddressed-question');
  assertDeepEqual(findings.map((f) => [f.severity, f.nodeId]), [['warning', 'q1']]);
});

test('an addressing study or an answering claim clears a leaf', () => {
  const addressed = g(
    [n('q1', 'question', 'open'), n('s1', 'study', 'planned')],
    [e('s1', 'addresses', 'q1')],
  );
  assertDeepEqual(flagged(addressed, 'unaddressed-question'), []);
  const answered = g(
    [n('q1', 'question', 'answered'), n('c1', 'claim', 'established'), n('f1', 'finding', 'supported')],
    [e('c1', 'answers', 'q1'), e('f1', 'supports', 'c1')],
  );
  assertDeepEqual(flagged(answered, 'unaddressed-question'), []);
});

test('a parent question is never "unaddressed" — it gets no-synthesis when no claim answers it', () => {
  const graph = g(
    [n('q1', 'question', 'open'), n('q2', 'question', 'open'), n('s1', 'study', 'running')],
    [e('q2', 'asks', 'q1'), e('s1', 'addresses', 'q2')],
  );
  assertDeepEqual(flagged(graph, 'unaddressed-question'), [], 'q1 is a parent, q2 is addressed');
  assertDeepEqual(flagged(graph, 'no-synthesis'), ['q1']);
});

test('a claim of its own clears the parent', () => {
  const graph = g(
    [n('q1', 'question', 'partly-answered'), n('q2', 'question', 'open'),
     n('c1', 'claim', 'provisional'), n('f1', 'finding', 'supported'), n('s1', 'study', 'running')],
    [e('q2', 'asks', 'q1'), e('c1', 'answers', 'q1'), e('f1', 'supports', 'c1'),
     e('s1', 'addresses', 'q2')],
  );
  assertDeepEqual(flagged(graph, 'no-synthesis'), []);
});

describe('Lint rule 4 — unwarranted question');

test('a root question with no motivating gap is flagged', () => {
  assertDeepEqual(flagged(g([n('q1', 'question', 'open')]), 'unwarranted-question'), ['q1']);
});

test('a motivating gap clears the root', () => {
  const graph = g(
    [n('q1', 'question', 'open'), n('g1', 'gap', 'verified')],
    [e('g1', 'motivates', 'q1')],
  );
  assertDeepEqual(flagged(graph, 'unwarranted-question'), []);
});

describe('Lint rule 8 — status mismatch');

// Shared shape: gap → question ← claim ← finding(s), question marked answered.
function answeredQuestion(...findingStatuses) {
  const nodes = [
    n('q1', 'question', 'answered'), n('c1', 'claim', 'established'),
    ...findingStatuses.map((s, i) => n(`f${i + 1}`, 'finding', s)),
  ];
  const edges = [
    e('c1', 'answers', 'q1'),
    ...findingStatuses.map((s, i) => e(`f${i + 1}`, 'supports', 'c1')),
  ];
  return g(nodes, edges);
}

test('types and statuses migrate per §7; the migrated graph validates', () => {
  const { graph } = migrateOldMap(oldMap);
  assertDeepEqual(validateGraph(graph), []);

  const status = (id) => graph.nodes.find((x) => x.id === id).status;

    { family: 'Kenny', given: 'David A.' }, { family: 'Cook', given: 'William' },
  ]);
  assertEqual(items[0].title, 'Interpersonal Perception and its friends', 'braces stripped');
  assertEqual(items[0]['container-title'], 'Psychological Review');
  assertEqual(items[0].page, '246–268', 'double hyphen becomes an en dash');
  assertDeepEqual(items[0].issued, { 'date-parts': [[1994]] });
  assertDeepEqual(items[1].author, [{ family: 'Mischel', given: 'Walter' }],
    'plain "Given Family" names split on the last word');
  assertEqual(items[1].type, 'book');
});

test('biblatex fields work: journaltitle, date, and @comment is skipped', () => {
  const items = parseBibtex(`
    @comment{jabref-meta: databaseType:biblatex;}
    @article{rau2024, author = {Rau, R.}, title = {T}, journaltitle = {Preprint Server}, date = {2024-05-01} }
  `);
  assertEqual(items.length, 1);
  assertEqual(items[0]['container-title'], 'Preprint Server');
  assertDeepEqual(items[0].issued, { 'date-parts': [[2024]] });
});

describe('Sources — detection and import planning');

test('parseSourcesText accepts a CSL array, an {items} object, and BibTeX', () => {
  assertEqual(parseSourcesText('[{"id":"a","title":"T"}]').items.length, 1);
  assertEqual(parseSourcesText('{"items":[{"id":"a","title":"T"}]}').items.length, 1);
  assertEqual(parseSourcesText('@misc{x, title={T}}').items.length, 1);
  assertEqual(parseSourcesText('[{"id":"a","title":"T"},{"id":"junk"}]').ignored, 1,
    'items with neither title nor author are counted as ignored');
});

test('parseSourcesText rejects what it cannot read, with a reason', () => {
  for (const bad of ['', 'hello world', '{"nodes":[]}', '[{']) {
    let threw = false;
    try { parseSourcesText(bad); } catch { threw = true; }
    assert(threw, `rejects ${JSON.stringify(bad)}`);
  }
});

test('new items become to-read source nodes; colliding ids get a suffix', () => {
  const graph = g([n('kenny1994', 'note')]);
  const plan = planSourceImport(graph, [{ id: 'kenny1994', title: 'T', author: [{ family: 'Kenny' }] }]);
  assertEqual(plan.updates.length, 0, 'a note with the same id is not an update target');
  assertEqual(plan.creates.length, 1);
  assertEqual(plan.creates[0].id, 'kenny1994-2', 'id collision with a non-source gets a suffix');
  assertEqual(plan.creates[0].status, 'to-read');
});

test('re-import updates rather than duplicates: zoteroKey, then DOI, then citation key', () => {
  const graph = g([
    n('src-a', 'source', 'verified', { meta: { zoteroKey: 'AAAA1111' } }),
    n('src-b', 'source', 'read', { meta: { doi: '10.1/B' } }),
    n('src-c', 'source', 'unverified'),
  ]);
  const plan = planSourceImport(graph, [
    { id: '99/AAAA1111', title: 'A new title', author: [{ family: 'A' }] },
    { id: 'different-key', title: 'B', DOI: '10.1/b', author: [{ family: 'B' }] },
    { id: 'src-c', title: 'C', author: [{ family: 'C' }] },
    { id: 'brand-new', title: 'D', author: [{ family: 'D' }] },
  ]);
  assertDeepEqual(plan.updates.map((u) => u.id), ['src-a', 'src-b', 'src-c']);
  assertDeepEqual(plan.creates.map((c) => c.id), ['brand-new']);
  assertEqual(plan.updates[1].id, 'src-b', 'DOI match is case-insensitive');
});

test('the same item twice in one paste is skipped, not duplicated', () => {
  const item = { id: '99/AAAA1111', title: 'T', author: [{ family: 'A' }] };
  const plan = planSourceImport(g([]), [item, item]);
  assertEqual(plan.creates.length, 1);
  assertEqual(plan.skipped, 1);
});

test('applySourcePatch updates label, Citation, Type and meta but never status or extra fields', () => {
  const node = n('src-a', 'source', 'verified', {
    fields: { Citation: 'old', Notes: 'mine' }, meta: { doi: '10.1/A' },
  });
  applySourcePatch(node, cslToSource({
    id: '99/AAAA1111', title: 'New title', author: [{ family: 'A' }],
    issued: { 'date-parts': [[2020]] }, 'container-title': 'Journal', DOI: '10.1/A',
  }));
  assertEqual(node.label, 'A (2020) — New title');
  assertEqual(node.status, 'verified', 'status survives the re-import');
  assertEqual(node.fields.Notes, 'mine', 'user fields survive');
  assertEqual(node.fields.Citation, 'Journal, 10.1/A');
  assertEqual(node.meta.zoteroKey, 'AAAA1111', 'meta merges');
  assertDeepEqual(validateNode(node), []);
});

// ---- render --------------------------------------------------------------

const container = document.getElementById('results');
let currentSection = null;
let list = null;
for (const r of results) {
  if (r.section !== currentSection) {
    currentSection = r.section;
    const h = document.createElement('h2');
    h.textContent = r.section;
    container.append(h);
    list = document.createElement('ul');
    container.append(list);
  }
  const li = document.createElement('li');
  li.className = r.ok ? 'pass' : 'fail';
  li.textContent = r.name;
  if (!r.ok) {
    const pre = document.createElement('pre');
    pre.textContent = String(r.error?.stack ?? r.error);
    li.append(pre);
  }
  list.append(li);
}
const failed = results.filter((r) => !r.ok).length;
const summary = document.getElementById('summary');
summary.textContent = failed === 0
  ? `All ${results.length} tests pass`
  : `${failed} of ${results.length} tests FAILED`;
summary.className = failed === 0 ? 'pass' : 'fail';
document.title = `${failed === 0 ? '✓' : '✗'} Research graph — tests`;
</script>
